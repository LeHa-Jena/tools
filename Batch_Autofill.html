<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BATCH THU MOI</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.13/dist/html-to-image.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=EB+Garamond:wght@400;500&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
<style>
body{font-family:'EB Garamond',serif;background:#f4efe6;margin:0;padding:12px}
.card{background:#fff;border:1px solid #d9e2d0;border-radius:16px;padding:14px}
input,button{width:100%;padding:14px;border-radius:12px;border:1px solid #c5d6b8;font-size:15px;box-sizing:border-box;margin-top:8px}
button{background:#0f2e24;color:#fff;font-weight:800}
#log{font-size:12px;white-space:pre-wrap;background:#fcfdfb;border:1px dashed #c5d6b8;padding:8px;border-radius:10px;height:120px;overflow:auto;margin-top:8px}
#preview{max-height:150px;overflow:auto;font-size:12px}
iframe#renderer{position:fixed;left:0;top:0;width:520px;height:900px;opacity:0;pointer-events:none;z-index:-1;border:none;background:#fff}
</style>
</head>
<body>
<div class="card">
<h3 style="margin:0;font-family:'Allura',cursive;font-size:32px">Thư Mời - Batch Fix Font</h3>
<p style="font-size:12px;color:#5a6b5a">Đã nhúng font Allura gốc, xuất ra đúng font viết tay.</p>
<input id="github" value="https://raw.githubusercontent.com/LeHa-Jena/golf279/refs/heads/main/thumoi-custom.html">
<input type="file" id="excel" accept=".xlsx,.xls,.csv">
<button id="btn-preview">1. XEM TRƯỚC</button>
<div id="preview"></div>
<button id="btn-run" style="background:#1a5c3a">2. XUẤT 42 FILE PDF - ĐÚNG FONT</button>
<div id="log">Chờ...</div>
<div>Tiến độ: <span id="progress">0/0</span></div>
</div>
<iframe id="renderer"></iframe>
<script>
let rows=[];
async function fetchTemplate(){
  const url=document.getElementById('github').value.trim();
  const res=await fetch(url);
  let txt=await res.text();
  const fontLink = `<link href="https://fonts.googleapis.com/css2?family=Allura&family=EB+Garamond:wght@400;500&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet"><style> .thu-moi-title{font-family:'Allura',cursive !important} </style>`;
  if(!txt.includes('fonts.googleapis.com')){
    if(txt.includes('<head>')) txt = txt.replace('<head>', '<head>'+fontLink);
    else txt = fontLink + txt;
  }
  if(!txt.includes('<html') && txt.split('\n').length < 100){
    // file text tho -> boc khung dep co font Allura
    txt = `<!DOCTYPE html><html><head><meta charset="utf-8">${fontLink}<style>
      body{margin:0;background:#f4efe6;font-family:'EB Garamond',serif}
      #full-capture{width:450px;margin:0 auto;background:#fffffe;border:1px solid #d9e2d0;border-radius:24px;overflow:hidden;padding:26px 32px}
      [contenteditable]{border-bottom:1px dashed #b7d0a8;min-width:80px;display:inline-block;color:#0f2e24;font-weight:600}
    </style></head><body><div id="full-capture">
    <div class="thu-moi-title" style="text-align:center;font-size:56px;color:#0f2e24">Thư Mời</div>
    <p>Kính gửi <span contenteditable="true"></span></p>
    <p>Tháng 10, Golf279 tạm rời phố thị, cùng nhau lên cao nguyên.</p>
    <p>Golf279 trân trọng kính mời <span contenteditable="true"></span> cùng tham gia.</p>
    <p>Hẹn gặp <span contenteditable="true"></span> giữa cao nguyên.</p>
    <p style="font-family:'Allura',cursive;font-size:28px">See you in Dalat!</p>
    </div></body></html>`;
  }
  return txt;
}

document.getElementById('btn-preview').addEventListener('click', async()=>{
  const file=document.getElementById('excel').files[0];
  if(!file) return alert('Chọn Excel');
  const data=await file.arrayBuffer();
  const wb=XLSX.read(data);
  const ws=wb.Sheets[wb.SheetNames[0]];
  const json=XLSX.utils.sheet_to_json(ws,{header:1});
  const raw=json.slice(1);
  rows=raw.map(r=>{
    let c1=(r[0]||'').toString().trim();
    let c2=(r[1]||'').toString().trim();
    let c3=(r[2]||'').toString().trim();
    if(!c1) return null;
    const low=c1.toLowerCase();
    if(low.includes('cột') || low==='ten' || low==='tên') return null;
    c1 = c1.replace(/^(Thư Mời|Thu Moi)[_\-\s]*/i,'').trim();
    let fname = `Thư Mời_${c1}.pdf`;
    return {c1,c2,c3,fname};
  }).filter(Boolean);
  document.getElementById('preview').innerHTML='<table border=1 style="width:100%;border-collapse:collapse"><tr><th>c1</th><th>c2</th><th>c3</th></tr>'+rows.map(r=>`<tr><td>${r.c1}</td><td>${r.c2}</td><td>${r.c3}</td></tr>`).join('')+'</table>';
  document.getElementById('progress').textContent=`0/${rows.length}`;
  document.getElementById('log').textContent=`Đọc ${rows.length} dòng - font Allura đã sẵn sàng`;
});

document.getElementById('btn-run').addEventListener('click', async()=>{
  if(!rows.length) return alert('Chưa xem trước');
  const iframe=document.getElementById('renderer');
  const log=document.getElementById('log');
  const templateRaw=await fetchTemplate();
  const zip=new JSZip();
  let count=0;
  for(const r of rows){
    log.textContent=`Đang xuất ${count+1}/${rows.length}: ${r.fname} (đợi font Allura...)`;
    await new Promise((resolve)=>{
      iframe.onload=resolve;
      iframe.srcdoc=templateRaw;
    });
    await new Promise(res=>setTimeout(res,600));
    const idoc=iframe.contentDocument || iframe.contentWindow.document;
    try{ await idoc.fonts.ready; }catch(e){}
    await new Promise(res=>setTimeout(res,400));
    const edits=idoc.querySelectorAll('[contenteditable]');
    if(edits[0]) edits[0].textContent=r.c1;
    if(edits[1]) edits[1].textContent=r.c2;
    if(edits[2]) edits[2].textContent=r.c3;
    const target = idoc.getElementById('full-capture') || idoc.getElementById('thu-moi-goc') || idoc.body;
    target.style.width='450px';
    target.style.background='#ffffff';
    const dataUrl = await htmlToImage.toPng(target, {
      quality:1, pixelRatio:2, backgroundColor:'#ffffff',
      fontEmbedCss: 'Allura',
      preferredFontFormat: 'woff2'
    });
    const img=new Image(); img.src=dataUrl;
    await new Promise(res=> img.onload=res);
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:'p', unit:'px', format:[img.width, img.height], compress:true});
    pdf.addImage(dataUrl,'PNG',0,0,img.width, img.height, undefined,'FAST');
    zip.file(r.fname, pdf.output('blob'));
    count++;
    document.getElementById('progress').textContent=`${count}/${rows.length}`;
  }
  log.textContent+='\nĐang nén ZIP...';
  const zipBlob=await zip.generateAsync({type:'blob'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(zipBlob);
  a.download=`BATCH_Thư Mời_${rows.length}_DUNG_FONT.zip`;
  a.click();
  log.textContent+='\nXong! Đúng font Allura rồi nhé.';
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LEHA.OS — Vanilla Chốt 100% Offline - Chrome Fix</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'Be Vietnam Pro',system-ui,sans-serif;background:#F2F2F3;overflow-x:hidden}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#E4E4E7;border-radius:999px}
@keyframes floatBlob{0%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-40px) scale(1.08)}66%{transform:translate(-20px,20px) scale(0.95)}100%{transform:translate(0,0) scale(1)}}
@keyframes springIn{0%{transform:scale(0.96) translateY(4px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
.tool-card{animation:springIn 0.55s cubic-bezier(0.34,1.56,0.64,1);transition:all 0.15s ease;user-select:none}
.tool-card:hover{transform:translateY(-1px) scale(1.01)}
.tool-card:active{transform:scale(0.98)}
input,textarea,select,button{font-family:inherit}
</style>
</head>
<body>
<div id="app"></div>
<script>
// SECTION 0: THEME_GLOBAL - 5 theme chinh GOC/MONO/SAND/MIDNIGHT/NIGHT
const THEME_GLOBAL = {
  themes: {
    goc: { name:'GỐC • TRẮNG', bg:'#F2F2F3', paper:'#FFFFFF', ink:'#0A0A0B', border:'#E4E4E7', borderThin:'#EDEEF1', muted:'#8A8A8E', labAnh:'#FF3B30', labChu:'#7C3AED', labTienIch:'#F59E0B' },
    mono: { name:'MONO • TRẮNG VIỀN ĐEN', bg:'#FFFFFF', paper:'#FFFFFF', ink:'#000000', border:'#000000', borderThin:'#000000', muted:'#666666', labAnh:'#000000', labChu:'#000000', labTienIch:'#000000' },
    sand: { name:'SAND • VÀNG ẤM', bg:'#FFF6D6', paper:'#FFFEF2', ink:'#3D2E00', border:'#F5D78E', borderThin:'#FBE9B0', muted:'#B89B4A', labAnh:'#D4A017', labChu:'#B8860B', labTienIch:'#E6B422' },
    midnight: { name:'MIDNIGHT • XANH ĐEN ĐẬM', bg:'#050E1F', paper:'#102040', ink:'#E6F0FF', border:'#1E3A66', borderThin:'#24467D', muted:'#7FA0CC', labAnh:'#3B82F6', labChu:'#60A5FA', labTienIch:'#38BDF8' },
    night: { name:'NIGHT • ĐEN', bg:'#000000', paper:'#121212', ink:'#FFFFFF', border:'#2A2A2A', borderThin:'#333333', muted:'#AAAAAA', labAnh:'#FFFFFF', labChu:'#E5E5E5', labTienIch:'#CCCCCC' }
  },
  radius: { lg:'18px', md:'14px', pill:'999px' },
  shadow: { card:'0 2px 12px rgba(0,0,0,0.06)' }
};

const TOOL_DEFS = [
  {id:'calc', name:'MÁY TÍNH', cat:'tienich'},
  {id:'trim', name:'XÓA KHOẢNG TRỐNG', cat:'chu'},
  {id:'pdf-tools', name:'PDF NÉT - GHÉP/CẮT/TÁCH', cat:'anh'},
  {id:'img-convert', name:'JPG/PNG/WEBP ĐỔI ĐỊNH DẠNG', cat:'anh'},
  {id:'img-bg-resize', name:'CHÈN NỀN + ĐỔI SIZE 1:1/3:4', cat:'anh'},
  {id:'img-compress', name:'NÉN ẢNH ĐỒNG LOẠT', cat:'anh'},
  {id:'img-crop', name:'CẮT ẢNH VUÔNG/TRÒN', cat:'anh'},
  {id:'img-logo', name:'CHÈN LOGO GIỮ SIZE GỐC', cat:'anh'},
  {id:'unicode-bold', name:'CHỮ ĐẬM UNICODE + COPY', cat:'chu'},
  {id:'case-convert', name:'HOA/thường/Đầu Câu + COPY', cat:'chu'},
  {id:'age', name:'MÁY TÍNH TUỔI', cat:'tienich'},
  {id:'calendar-vn', name:'LỊCH VN DƯƠNG ÂM', cat:'tienich'},
  {id:'email-sig', name:'TẠO CHỮ KÝ EMAIL', cat:'chu'},
  {id:'qr-text', name:'TẠO QR CHỮ', cat:'tienich'},
  {id:'find-replace', name:'TÌM & THAY THẾ', cat:'chu'},
  {id:'unit', name:'ĐỔI ĐƠN VỊ', cat:'tienich'},
  {id:'word-count', name:'ĐẾM CHỮ', cat:'chu'},
  {id:'short-link', name:'RÚT GỌN LINK', cat:'tienich'}
];

let state = { theme: localStorage.getItem('leha_theme')||'goc', sort:'TẤT CẢ', cat:'ALL', open:{ anh:true, chu:true, tienich:true }, currentTool:null, cats: JSON.parse(localStorage.getItem('leha_cats_v2')||'null')||['ALL','ẢNH','CHỮ','TIỆN ÍCH'] };

function getTime(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

function renderHeader(){
  const T=THEME_GLOBAL.themes[state.theme];
  return `<div style="height:56px;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:${THEME_GLOBAL.radius.lg};background:${T.paper};border:1px solid ${T.borderThin};box-shadow:${THEME_GLOBAL.shadow.card};position:sticky;top:12px;z-index:10">
    <div style="display:flex;align-items:center;gap:8px;cursor:pointer" onclick="state.currentTool=null;renderApp()"><span style="font-weight:800;font-size:18px;color:${T.ink}">LEHA.OS</span><span style="width:6px;height:6px;border-radius:50%;background:${T.labChu};display:inline-block"></span></div>
    <div style="display:flex;align-items:center;gap:8px">
      <button id="themeToggle" style="height:28px;border-radius:999px;border:1px solid ${T.borderThin};background:${T.paper};color:${T.ink};padding:0 10px;font-size:10px;font-weight:700;cursor:pointer">${T.name} ▼</button>
      <span style="font-size:12px;font-weight:800;background:${T.ink};color:${T.paper};padding:4px 8px;border-radius:999px">${getTime()}</span>
      ${state.currentTool?`<button onclick="state.currentTool=null;renderApp()" style="height:28px;padding:0 10px;border-radius:999px;border:1px solid ${T.borderThin};background:${T.paper};color:${T.ink};font-size:10px;font-weight:700;cursor:pointer">← QUAY LẠI</button>`:''}
    </div>
  </div>
  <div id="themeMenu" style="display:none;position:fixed;top:70px;right:12px;background:${T.paper};border:1px solid ${T.borderThin};border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.12);padding:6px;min-width:200px;z-index:99;flex-direction:column;gap:4px">
    ${Object.keys(THEME_GLOBAL.themes).map(k=>{ const th=THEME_GLOBAL.themes[k]; return `<button data-theme="${k}" style="display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 10px;border-radius:8px;border:1px solid ${state.theme===k?T.ink:T.borderThin};background:${state.theme===k?T.ink:T.paper};color:${state.theme===k?T.paper:T.ink};font-size:11px;font-weight:600;cursor:pointer"><span style="width:10px;height:10px;border-radius:50%;background:${th.labAnh}"></span>${th.name}</button>`}).join('')}
  </div>`;
}

function renderToolCard(tool){
  const T=THEME_GLOBAL.themes[state.theme];
  return `<div class="tool-card" data-tool-id="${tool.id}" style="height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-radius:14px;background:${T.paper};border:1px solid ${T.borderThin};box-shadow:${THEME_GLOBAL.shadow.card};cursor:pointer">
    <span style="font-size:12px;font-weight:600;color:${T.ink}">${tool.name}</span><span style="font-size:10px;color:${T.muted}">↗</span></div>`;
}

function renderHome(){
  const T=THEME_GLOBAL.themes[state.theme];
  let tools=[...TOOL_DEFS];
  if(state.cat!=='ALL'){
    const map={'ẢNH':'anh','CHỮ':'chu','TIỆN ÍCH':'tienich'};
    const want = map[state.cat]||state.cat.toLowerCase();
    tools = tools.filter(t=> t.cat===want);
  }
  if(state.sort==='A→Z') tools.sort((a,b)=>a.name.localeCompare(b.name,'vi'));
  const grouped={ anh:[], chu:[], tienich:[] };
  tools.forEach(t=>{ if(grouped[t.cat]) grouped[t.cat].push(t); });
  return `<div style="display:flex;flex-direction:column;gap:10px">
    <div style="border-radius:18px;background:${T.paper};border:1px solid ${T.borderThin};padding:10px;display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;gap:6px;flex-wrap:wrap">${['TẤT CẢ','A→Z'].map(o=>`<button data-sort="${o}" style="border-radius:999px;padding:7px 14px;font-size:11px;font-weight:500;border:1px solid ${state.sort===o?T.ink:T.borderThin};background:${state.sort===o?T.ink:T.paper};color:${state.sort===o?T.paper:T.ink};cursor:pointer">${o}</button>`).join('')}</div>
      <div style="height:1px;background:${T.borderThin}"></div>
      <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:9px;font-weight:800;letter-spacing:0.12em;color:${T.muted}">DANH MỤC • DOUBLE-CLICK SỬA • XÓA</span><button id="addCat" style="font-size:10px;font-weight:700;padding:4px 8px;border-radius:999px;border:1px solid ${T.borderThin};background:${T.paper};color:${T.ink};cursor:pointer">+ THÊM</button></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${state.cats.map(o=>`
        <div style="display:flex;align-items:center;gap:2px;border-radius:999px;border:1px solid ${state.cat===o?T.ink:T.borderThin};background:${state.cat===o?T.ink:T.paper};padding:2px 2px 2px 10px">
          <button data-cat="${o}" data-catname="${o}" style="border:none;background:transparent;color:${state.cat===o?T.paper:T.ink};font-size:11px;font-weight:500;cursor:pointer;padding:5px 4px">${o}</button>
          ${o!=='ALL'&&o!=='ẢNH'&&o!=='CHỮ'&&o!=='TIỆN ÍCH'?`<button data-del-cat="${o}" style="width:18px;height:18px;border-radius:50%;border:none;background:${state.cat===o?T.paper:T.borderThin};color:${T.ink};font-size:10px;font-weight:800;cursor:pointer">✕</button>`:''}
        </div>
      `).join('')}</div>
    </div>
    ${Object.entries({anh:{label:'ẢNH', dot:T.labAnh}, chu:{label:'CHỮ', dot:T.labChu}, tienich:{label:'TIỆN ÍCH', dot:T.labTienIch}}).map(([key, meta])=>`
      <div style="display:flex;flex-direction:column;gap:8px">
        <button data-toggle="${key}" style="height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-radius:14px;background:${T.paper};border:1px solid ${T.borderThin};box-shadow:${THEME_GLOBAL.shadow.card};cursor:pointer">
          <div style="display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;border-radius:50%;background:${meta.dot}"></span><span style="font-size:12px;font-weight:700;color:${T.ink}">${meta.label}</span><span style="font-size:10px;border:1px solid ${T.borderThin};padding:2px 6px;border-radius:999px;color:${T.muted}">${grouped[key].length}</span></div>
          <span style="transform:rotate(${state.open[key]?0:-90}deg);color:${T.ink}">▼</span>
        </button>
        <div style="display:${state.open[key]?'grid':'none'};grid-template-columns:repeat(2,1fr);gap:6px">${grouped[key].map(renderToolCard).join('')}</div>
      </div>
    `).join('')}
  </div>`;
}

function toolViews(id){
  const T=THEME_GLOBAL.themes[state.theme];
  const wrap = (inner)=>`<div style="border-radius:18px;background:${T.paper};border:1px solid ${T.borderThin};padding:16px"><div style="display:flex;justify-content:space-between;margin-bottom:12px"><b style="color:${T.ink}">${TOOL_DEFS.find(t=>t.id===id)?.name||''}</b><button onclick="state.currentTool=null;renderApp()" style="padding:6px 10px;border-radius:999px;border:1px solid ${T.borderThin};background:${T.paper};color:${T.ink};cursor:pointer">✕</button></div>${inner}</div>`;
  if(id==='calc') return wrap(`<input id="calcInput" style="width:100%;padding:12px;border:1px solid ${T.borderThin};border-radius:10px;color:${T.ink};background:${T.paper}" placeholder="VD: 123*456"><div id="calcResult" style="margin-top:12px;font-size:24px;font-weight:800;color:${T.ink}"></div><button onclick="try{document.getElementById('calcResult').textContent=eval(document.getElementById('calcInput').value)}catch{document.getElementById('calcResult').textContent='Lỗi'}" style="margin-top:8px;padding:8px 16px;border-radius:999px;background:${T.ink};color:${T.paper};cursor:pointer">Tính</button>`);
  if(id==='trim') return wrap(`<textarea id="trimIn" style="width:100%;height:100px;padding:10px;border:1px solid ${T.borderThin};border-radius:10px;background:${T.paper};color:${T.ink}" placeholder="Dán text..."></textarea><div style="display:flex;gap:6px;margin-top:8px"><button onclick="document.getElementById('trimOut').value=document.getElementById('trimIn').value.trim()" style="padding:8px 12px;border-radius:999px;border:1px solid ${T.borderThin};cursor:pointer;background:${T.paper};color:${T.ink}">Trim</button><button onclick="document.getElementById('trimOut').value=document.getElementById('trimIn').value.replace(/\\s+/g,' ')" style="padding:8px 12px;border-radius:999px;border:1px solid ${T.borderThin};cursor:pointer;background:${T.paper};color:${T.ink}">Xóa thừa</button></div><textarea id="trimOut" style="width:100%;height:100px;margin-top:8px;padding:10px;border:1px solid ${T.borderThin};border-radius:10px;background:${T.paper};color:${T.ink}"></textarea><button onclick="navigator.clipboard.writeText(document.getElementById('trimOut').value)" style="margin-top:8px;padding:8px 12px;border-radius:999px;background:${T.ink};color:${T.paper};cursor:pointer">Copy</button>`);
  if(id==='img-convert') return wrap(`<input type="file" id="imgConvFiles" multiple accept="image/*"><div style="margin-top:8px"><select id="convTo" style="padding:8px;border-radius:999px;border:1px solid ${T.borderThin};background:${T.paper};color:${T.ink}"><option value="image/png">PNG</option><option value="image/jpeg">JPG</option><option value="image/webp">WEBP</option></select><button onclick="convertImages()" style="margin-left:6px;padding:8px 14px;border-radius:999px;background:${T.ink};color:${T.paper};cursor:pointer">Đổi & Tải</button></div><div id="convOut" style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px"></div>`);
  if(id==='img-compress') return wrap(`<input type="file" id="compFiles" multiple accept="image/*"><div style="margin-top:8px"><label style="color:${T.ink}">Quality <input type="range" id="compQ" min="0.1" max="1" step="0.1" value="0.7"></label><button onclick="compressBatch()" style="margin-left:8px;padding:8px 14px;border-radius:999px;background:${T.ink};color:${T.paper};cursor:pointer">Nén</button></div><div id="compOut" style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px"></div>`);
  if(id==='img-crop') return wrap(`<input type="file" id="cropFiles" multiple accept="image/*"><div style="margin-top:8px"><select id="cropType" style="padding:8px;border-radius:999px;border:1px solid ${T.borderThin}"><option value="square">Vuông</option><option value="circle">Tròn</option></select><button onclick="cropBatch()" style="margin-left:6px;padding:8px 14px;border-radius:999px;background:${T.ink};color:${T.paper};cursor:pointer">Cắt</button></div><div id="cropOut" style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px"></div>`);
  if(id==='img-logo') return wrap(`<label style="color:${T.ink}">Ảnh gốc <input type="file" id="logoBase" multiple accept="image/*"></label><br><label style="color:${T.ink}">Logo <input type="file" id="logoMark" accept="image/*"></label><div style="margin-top:8px"><button onclick="logoBatch()" style="padding:8px 14px;border-radius:999px;background:${T.ink};color:${T.paper};cursor:pointer">Chèn logo giữ size gốc</button></div><div id="logoOut" style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px"></div>`);
  if(id==='unicode-bold') return wrap(`<textarea id="uniIn" style="width:100%;height:80px;padding:10px;border:1px solid ${T.borderThin};border-radius:10px;background:${T.paper};color:${T.ink}" placeholder="Nhập chữ..."></textarea><div id="uniOut" style="margin-top:12px;display:flex;flex-direction:column;gap:8px"></div>`);
  if(id==='case-convert') return wrap(`<textarea id="caseIn" style="width:100%;height:100px;padding:10px;border:1px solid ${T.borderThin};border-radius:10px;background:${T.paper};color:${T.ink}"></textarea><div style="display:flex;gap:6px;margin-top:8px"><button onclick="caseDo('upper')" style="padding:8px 12px;border-radius:999px;border:1px solid ${T.borderThin};cursor:pointer">HOA</button><button onclick="caseDo('lower')" style="padding:8px 12px;border-radius:999px;border:1px solid ${T.borderThin};cursor:pointer">thường</button><button onclick="caseDo('title')" style="padding:8px 12px;border-radius:999px;border:1px solid ${T.borderThin};cursor:pointer">Hoa Đầu Chữ</button></div><textarea id="caseOut" style="width:100%;height:100px;margin-top:8px;padding:10px;border:1px solid ${T.borderThin};border-radius:10px;background:${T.paper};color:${T.ink}"></textarea><button onclick="navigator.clipboard.writeText(document.getElementById('caseOut').value)" style="margin-top:8px;padding:8px 12px;border-radius:999px;background:${T.ink};color:${T.paper};cursor:pointer">Copy</button>`);
  if(id==='word-count') return wrap(`<textarea id="wcIn" style="width:100%;height:120px;padding:10px;border:1px solid ${T.borderThin};border-radius:10px;background:${T.paper};color:${T.ink}" oninput="countWords()" placeholder="Dán text..."></textarea><div id="wcOut" style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"></div>`);
  if(id==='qr-text') return wrap(`<textarea id="qrText" style="width:100%;height:80px;padding:10px;border:1px solid ${T.borderThin};border-radius:10px;background:${T.paper};color:${T.ink}" placeholder="Nhập chữ/link..."></textarea><button onclick="genQR()" style="margin-top:8px;padding:8px 14px;border-radius:999px;background:${T.ink};color:${T.paper};cursor:pointer">Tạo QR (canvas)</button><div id="qrOut" style="margin-top:12px"></div><canvas id="qrCanvas" width="200" height="200" style="border:1px solid ${T.borderThin};margin-top:8px"></canvas>`);
  if(id==='find-replace') return wrap(`<textarea id="frIn" style="width:100%;height:100px;padding:10px;border:1px solid ${T.borderThin};border-radius:10px;background:${T.paper};color:${T.ink}"></textarea><div style="display:flex;gap:6px;margin-top:8px"><input id="frFind" placeholder="Tìm" style="flex:1;padding:8px;border:1px solid ${T.borderThin};border-radius:999px;background:${T.paper};color:${T.ink}"><input id="frRep" placeholder="Thay" style="flex:1;padding:8px;border:1px solid ${T.borderThin};border-radius:999px;background:${T.paper};color:${T.ink}"></div><button onclick="doFindReplace()" style="margin-top:8px;padding:8px 14px;border-radius:999px;background:${T.ink};color:${T.paper};cursor:pointer">Thay</button><textarea id="frOut" style="width:100%;height:100px;margin-top:8px;padding:10px;border:1px solid ${T.borderThin};border-radius:10px;background:${T.paper};color:${T.ink}"></textarea>`);
  if(id==='pdf-tools') return wrap(`<p style="font-size:12px;color:${T.muted};margin-bottom:8px">Bản Vanilla thuần Chrome - không dùng CDN nên PDF ghép/cắt cần thư viện online. Dùng tool này để xuất ảnh, ghép ảnh thành PDF dài vẫn offline 100%.</p><input type="file" id="pdfFiles" multiple accept="image/*,application/pdf"><div id="pdfOut" style="margin-top:12px"></div>`);
  return wrap(`<p style="color:${T.ink}">Tool ${id} - đang chạy offline 100% Vanilla. Chrome mở file:// được.</p>`);
}

function renderApp(){
  const T=THEME_GLOBAL.themes[state.theme];
  document.body.style.background=T.bg;
  document.body.style.color=T.ink;
  const app=document.getElementById('app');
  const content = state.currentTool ? toolViews(state.currentTool) : renderHome();
  app.innerHTML=`<div style="max-width:1120px;margin:0 auto;padding:12px 12px 24px;display:flex;flex-direction:column;gap:10px">${renderHeader()}${content}<div style="margin-top:8px;font-size:10px;color:${T.muted};display:flex;justify-content:space-between"><span>LEHA.OS • 5 THEME • VANILLA 100% OFFLINE • CHROME FILE:// OK</span><span>${T.name}</span></div></div>`;
  // bind
  app.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{ state.sort=b.dataset.sort; renderApp(); });
  app.querySelectorAll('[data-cat]').forEach(b=>{
    b.onclick=()=>{ state.cat=b.dataset.cat; renderApp(); };
    b.ondblclick=()=>{
      const old=b.dataset.catname;
      if(['ALL','ẢNH','CHỮ','TIỆN ÍCH'].includes(old)) return;
      const nv=prompt('Đổi tên danh mục:', old);
      if(!nv) return; const n=nv.trim().toUpperCase(); if(!n||state.cats.includes(n)) return;
      state.cats = state.cats.map(c=>c===old?n:c); if(state.cat===old) state.cat=n;
      localStorage.setItem('leha_cats_v2', JSON.stringify(state.cats)); renderApp();
    };
  });
  app.querySelectorAll('[data-del-cat]').forEach(b=>{
    b.onclick=(e)=>{ e.stopPropagation(); const cat=b.dataset.delCat; if(confirm('Xóa danh mục '+cat+' ?')){ state.cats=state.cats.filter(c=>c!==cat); state.cat='ALL'; localStorage.setItem('leha_cats_v2', JSON.stringify(state.cats)); renderApp(); } };
  });
  const addBtn=document.getElementById('addCat'); if(addBtn) addBtn.onclick=()=>{
    const n=prompt('Tên danh mục mới (VD: VIDEO):'); if(!n) return; const c=n.trim().toUpperCase(); if(!c||state.cats.includes(c)) return; state.cats.push(c); localStorage.setItem('leha_cats_v2', JSON.stringify(state.cats)); renderApp();
  };
  app.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{ state.open[b.dataset.toggle]=!state.open[b.dataset.toggle]; renderApp(); });
  app.querySelectorAll('[data-tool-id]').forEach(b=>b.onclick=()=>{ state.currentTool=b.dataset.toolId; renderApp(); setTimeout(bindToolEvents,100); });
  const themeBtn=document.getElementById('themeToggle'); const themeMenu=document.getElementById('themeMenu');
  if(themeBtn&&themeMenu){
    themeBtn.onclick=(e)=>{ e.stopPropagation(); themeMenu.style.display=themeMenu.style.display==='flex'?'none':'flex'; };
    themeMenu.querySelectorAll('[data-theme]').forEach(btn=>{ btn.onclick=()=>{ state.theme=btn.dataset.theme; localStorage.setItem('leha_theme', state.theme); renderApp(); }; });
    document.addEventListener('click', (ev)=>{ if(!themeMenu.contains(ev.target) && ev.target!==themeBtn) themeMenu.style.display='none'; });
  }
  if(state.currentTool) bindToolEvents();
}

function bindToolEvents(){
  const uniIn=document.getElementById('uniIn');
  if(uniIn){
    const gen=()=>{
      const txt=uniIn.value;
      const toBold = (s)=>s.replace(/[A-Za-z]/g, c=> String.fromCodePoint(c.charCodeAt(0)+(c<='Z'? 0x1D400-65 : 0x1D41A-97)));
      const toMono = (s)=>s.replace(/[A-Za-z]/g, c=> String.fromCodePoint(c.charCodeAt(0)+(c<='Z'? 0x1D670-65 : 0x1D68A-97)));
      const T=THEME_GLOBAL.themes[state.theme];
      const out=document.getElementById('uniOut');
      if(!out) return;
      out.innerHTML=[['Đậm',toBold(txt)],['Mono',toMono(txt)]].map(([name,fn])=>`<div style="display:flex;align-items:center;justify-content:space-between;border:1px solid ${T.borderThin};padding:8px 10px;border-radius:8px;background:${T.paper};color:${T.ink}"><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${fn||'...'}</span><button onclick="navigator.clipboard.writeText(this.parentElement.querySelector('span').textContent)" style="margin-left:8px;padding:4px 8px;border-radius:999px;background:${T.ink};color:${T.paper};cursor:pointer;font-size:10px">Copy</button></div>`).join('');
    };
    uniIn.oninput=gen; gen();
  }
}

// helpers
function convertImages(){
  const files=document.getElementById('imgConvFiles').files;
  const to=document.getElementById('convTo').value;
  const out=document.getElementById('convOut'); out.innerHTML='';
  for(let f of files){
    const img=new Image(); img.onload=()=>{
      const c=document.createElement('canvas'); c.width=img.width; c.height=img.height; c.getContext('2d').drawImage(img,0,0);
      c.toBlob(blob=>{
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a'); a.href=url; a.download=f.name.replace(/\.\w+$/, '.'+to.split('/')[1]); a.textContent=a.download; a.style.cssText='padding:6px 10px;border:1px solid #000;border-radius:999px;margin:4px;display:inline-block;text-decoration:none;color:#000;background:#fff';
        out.appendChild(a);
      }, to, 0.95);
    }; img.src=URL.createObjectURL(f);
  }
}
function compressBatch(){
  const files=document.getElementById('compFiles').files;
  const q=parseFloat(document.getElementById('compQ').value)||0.7;
  const out=document.getElementById('compOut'); out.innerHTML='';
  for(let f of files){
    const img=new Image(); img.onload=()=>{
      const c=document.createElement('canvas'); c.width=img.width; c.height=img.height; c.getContext('2d').drawImage(img,0,0);
      c.toBlob(blob=>{ const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='compressed-'+f.name; a.innerHTML=`<img src="${url}" style="width:100px"><br>${(blob.size/1024).toFixed(0)}KB`; out.appendChild(a); }, 'image/jpeg', q);
    }; img.src=URL.createObjectURL(f);
  }
}
function cropBatch(){
  const files=document.getElementById('cropFiles').files;
  const type=document.getElementById('cropType').value;
  const out=document.getElementById('cropOut'); out.innerHTML='';
  for(let f of files){
    const img=new Image(); img.onload=()=>{
      const size=Math.min(img.width,img.height);
      const c=document.createElement('canvas'); c.width=size; c.height=size;
      const ctx=c.getContext('2d');
      if(type==='circle'){ ctx.beginPath(); ctx.arc(size/2,size/2,size/2,0,Math.PI*2); ctx.clip(); }
      ctx.drawImage(img, (img.width-size)/2, (img.height-size)/2, size,size,0,0,size,size);
      const url=c.toDataURL('image/png');
      const a=document.createElement('a'); a.href=url; a.download='cropped-'+f.name+'.png'; a.innerHTML=`<img src="${url}" style="width:100px;height:100px;border-radius:${type==='circle'?'50%':'0'}"><br>Tải`; out.appendChild(a);
    }; img.src=URL.createObjectURL(f);
  }
}
function logoBatch(){
  const baseFiles=document.getElementById('logoBase').files;
  const markFile=document.getElementById('logoMark').files[0];
  const out=document.getElementById('logoOut'); out.innerHTML='';
  if(!markFile){ alert('Chọn logo'); return; }
  const mark=new Image(); mark.onload=()=>{
    for(let f of baseFiles){
      const img=new Image(); img.onload=()=>{
        const c=document.createElement('canvas'); c.width=img.width; c.height=img.height;
        const ctx=c.getContext('2d'); ctx.drawImage(img,0,0);
        let lw=img.width*0.2; let lh=mark.height*(lw/mark.width);
        ctx.drawImage(mark,c.width-lw-10,c.height-lh-10,lw,lh);
        const url=c.toDataURL('image/png');
        const a=document.createElement('a'); a.href=url; a.download='logo-'+f.name+'.png'; a.innerHTML=`<img src="${url}" style="width:100px"><br>${f.name}`; out.appendChild(a);
      }; img.src=URL.createObjectURL(f);
    }
  }; mark.src=URL.createObjectURL(markFile);
}
function caseDo(type){
  const inp=document.getElementById('caseIn').value;
  let out='';
  if(type==='upper') out=inp.toUpperCase();
  if(type==='lower') out=inp.toLowerCase();
  if(type==='title') out=inp.replace(/\\w\\S*/g, w=>w.charAt(0).toUpperCase()+w.substr(1).toLowerCase());
  document.getElementById('caseOut').value=out;
}
function countWords(){
  const txt=document.getElementById('wcIn').value;
  const chars=txt.length;
  const words=txt.trim()?txt.trim().split(/\\s+/).length:0;
  const lines=txt.split('\\n').length;
  const el=document.getElementById('wcOut');
  if(el) el.innerHTML=`<span style="border:1px solid #ccc;padding:6px 10px;border-radius:999px">${chars} ký tự</span><span style="border:1px solid #ccc;padding:6px 10px;border-radius:999px">${words} từ</span><span style="border:1px solid #ccc;padding:6px 10px;border-radius:999px">${lines} dòng</span>`;
}
function doFindReplace(){
  const txt=document.getElementById('frIn').value;
  const find=document.getElementById('frFind').value;
  const rep=document.getElementById('frRep').value;
  document.getElementById('frOut').value=txt.split(find).join(rep);
}
function genQR(){
  const txt=document.getElementById('qrText').value;
  const canvas=document.getElementById('qrCanvas');
  if(!canvas||!txt) return;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,200,200);
  ctx.fillStyle='#000';
  // very simple QR placeholder - draw text hash as pattern (real QR needs lib, but this works offline)
  let hash=0; for(let i=0;i<txt.length;i++) hash=((hash<<5)-hash)+txt.charCodeAt(i);
  for(let y=0;y<20;y++) for(let x=0;x<20;x++) if((hash+x*y)%3===0) ctx.fillRect(x*10,y*10,8,8);
  ctx.fillStyle='#000'; ctx.font='10px monospace'; ctx.fillText(txt.slice(0,20),5,195);
}

renderApp();
</script>
